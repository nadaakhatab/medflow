version: '3.8'

services:
  medflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medflow-production
    ports:
      - "7860:7860"
    environment:
      - APP_ENV=production
      - PORT=7860
      - DATA_DIR=/app/data
      - SECRET_KEY=${SECRET_KEY:-}
      - SECURE_COOKIE=${SECURE_COOKIE:-true}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - medflow_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  medflow_data:
    driver: local
